name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  validate-links:
    name: Validate Embedded Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate embedded URLs
        run: node scripts/validate-links.mjs

  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check version sync
        run: node scripts/sync-version.mjs --check

  bundle-sync:
    name: Frontend Bundle Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the frontend bundle
        run: npm run build:frontend

      - name: Assert the committed bundle matches its sources
        run: |
          if git diff --quiet -- src/generated/frontend.ts; then
            echo "Committed bundle matches its sources."
            exit 0
          fi
          echo "::error file=src/generated/frontend.ts::Committed bundle is out of sync with src/frontend/"
          echo ""
          echo "src/index.ts serves src/generated/frontend.ts, and build:frontend is NOT part of"
          echo "the deploy chain. A change to src/frontend/app.js, body.html or styles.css that"
          echo "does not carry a regenerated bundle will merge green, deploy green, and ship"
          echo "nothing. Six pull requests did exactly that before this check existed."
          echo ""
          echo "Fix: run 'npm run build:frontend' and commit src/generated/frontend.ts."
          echo ""
          git --no-pager diff --stat -- src/generated/frontend.ts
          git --no-pager diff -- src/generated/frontend.ts | head -60
          exit 1

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check for outdated dependencies
        run: node scripts/check-deps.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, validate-links, version-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build worker
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist/
          retention-days: 7

  # E2E Tests removed from CI to save runner minutes
  # Run locally with: npm run test:e2e
  # E2E tests should be run locally before pushing changes
