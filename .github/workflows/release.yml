name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate test report
        id: test-report
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/generate-test-report.mjs \
            --title "Genre Genie $VERSION - Test Report" \
            --description "Automated test results for release $VERSION"
          mv test-report.html "test-report-$VERSION.html"
          echo "report_file=test-report-$VERSION.html" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          echo "Looking for version $VERSION_NUM in CHANGELOG.md"

          CONTENT=""
          if [ -f CHANGELOG.md ]; then
            CONTENT=$(sed -n "/^## \[$VERSION_NUM\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          fi

          if [ -z "$CONTENT" ]; then
            echo "No changelog entry found; generating from commit messages"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --oneline "$PREV_TAG"..HEAD | sed 's/^[a-f0-9]* /- /')
            else
              LOG=""
            fi
            if [ -z "$LOG" ]; then
              LOG="- Release $VERSION"
            fi
            CONTENT=$(printf '## %s\n\n### Changes\n%s\n' "$VERSION" "$LOG")
          fi

          printf '%s\n' "$CONTENT" > release_notes.md
          echo "Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            ${{ steps.test-report.outputs.report_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
